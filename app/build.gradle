plugins {
    id 'com.android.application'
}

android {
    namespace 'com.saji.grandcity'
    compileSdk 35

    defaultConfig {
        applicationId 'com.saji.grandcity'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-prototype'
        }
        release {
            minifyEnabled false
        }
    }
}
